<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">A live robotics control cycle</title><desc id="desc">Sensor input passes through state estimation and motion control before telemetry closes the loop.</desc>
  <rect width="1200" height="300" fill="#0d1117"/>
  <g stroke="#dce4ff" stroke-width="1" opacity=".08"><path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200"/><path d="M120 0v300M360 0v300M600 0v300M840 0v300M1080 0v300"/></g>
  <g font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace"><text x="56" y="48" fill="#dce4ff" font-size="15" font-weight="700" letter-spacing="3">LIVE CONTROL CYCLE</text><text x="1144" y="48" fill="#ff5b19" font-size="14" font-weight="700" text-anchor="end">RUNNING</text><circle cx="1038" cy="43" r="6" fill="#ff5b19"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle></g>
  <path d="M146 150H1054" fill="none" stroke="#293047" stroke-width="8"/>
  <path d="M146 150H1054" fill="none" stroke="#ff5b19" stroke-width="8" pathLength="1" stroke-dasharray=".23 .77"><animate attributeName="stroke-dashoffset" values="1;0" dur="4.8s" repeatCount="indefinite"/></path>
  <g font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-weight="700" text-anchor="middle">
    <g transform="translate(160 150)"><rect x="-104" y="-42" width="208" height="84" fill="#1438c7" stroke="#f5f3ec" stroke-width="2"/><text y="-5" fill="#fffdf7" font-size="17">SENSOR INPUT</text><text y="20" fill="#dce4ff" font-size="12">CAMERA + ENCODERS</text><animateTransform attributeName="transform" type="translate" values="160 150;160 144;160 150" begin="0s" dur="1.2s" repeatCount="indefinite"/></g>
    <g transform="translate(452 150)"><rect x="-104" y="-42" width="208" height="84" fill="#dce4ff" stroke="#f5f3ec" stroke-width="2"/><text y="-5" fill="#121212" font-size="17">STATE ESTIMATE</text><text y="20" fill="#0c258d" font-size="12">X / Y / HEADING</text><animateTransform attributeName="transform" type="translate" values="452 150;452 144;452 150" begin="1.2s" dur="1.2s" repeatCount="indefinite"/></g>
    <g transform="translate(744 150)"><rect x="-104" y="-42" width="208" height="84" fill="#ff5b19" stroke="#f5f3ec" stroke-width="2"/><text y="-5" fill="#121212" font-size="17">MOTION CONTROL</text><text y="20" fill="#121212" font-size="12">ERROR / CORRECTION</text><animateTransform attributeName="transform" type="translate" values="744 150;744 144;744 150" begin="2.4s" dur="1.2s" repeatCount="indefinite"/></g>
    <g transform="translate(1036 150)"><rect x="-104" y="-42" width="208" height="84" fill="#121212" stroke="#f5f3ec" stroke-width="2"/><text y="-5" fill="#fffdf7" font-size="17">TELEMETRY</text><text y="20" fill="#dce4ff" font-size="12">INSPECT + RETUNE</text><animateTransform attributeName="transform" type="translate" values="1036 150;1036 144;1036 150" begin="3.6s" dur="1.2s" repeatCount="indefinite"/></g>
  </g>
  <path d="M1036 208C1036 270 160 270 160 208" fill="none" stroke="#1438c7" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/></path>
  <text x="598" y="279" fill="#dce4ff" opacity=".7" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="2">FEEDBACK CLOSES THE LOOP</text>
</svg>