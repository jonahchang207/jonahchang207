<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Start a conversation</title><desc id="desc">Contact Jonah about robotics, computer vision, or engineering.</desc>
  <rect width="1200" height="230" fill="#121212"/>
  <path d="M0 196C210 80 330 270 540 142S860 26 1200 132" fill="none" stroke="#1438c7" stroke-width="14"/>
  <path d="M0 196C210 80 330 270 540 142S860 26 1200 132" fill="none" stroke="#ff5b19" stroke-width="6" pathLength="1" stroke-dasharray=".16 .05"><animate attributeName="stroke-dashoffset" values="1;0" dur="8s" repeatCount="indefinite"/></path>
  <g font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace"><text x="52" y="78" fill="#dce4ff" font-size="16" font-weight="700" letter-spacing="3">ROBOTICS / VISION / ENGINEERING</text><text x="52" y="142" fill="#fffdf7" font-size="48" font-weight="800" letter-spacing="-2">START A CONVERSATION</text></g>
  <g transform="translate(1090 130)"><circle r="28" fill="#ff5b19"/><circle r="9" fill="#121212"><animate attributeName="r" values="7;11;7" dur="1.8s" repeatCount="indefinite"/></circle><text x="0" y="58" fill="#dce4ff" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="2">CONTACT</text></g>
</svg>